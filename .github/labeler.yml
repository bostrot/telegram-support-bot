# Add 'source' label to any change to src files within the source dir EXCEPT for the docs sub-folder
source:
- changed-files:
  - any-glob-to-any-file: ['src/**/*']

dependency:
- changed-files:
  - any-glob-to-any-file: ['package.json', 'package-lock.json']


config:
- changed-files:
  - any-glob-to-any-file: ['config/**/*']

test:
- changed-files:
  - any-glob-to-any-file: ['test/**/*']

docker:
- changed-files:
  - any-glob-to-any-file: ['Dockerfile', 'docker-compose.yml', 'Dockerfile.signal']

github:
- changed-files:
  - any-glob-to-any-file: ['.github/**']

githooks:
- changed-files:
  - any-glob-to-any-file: ['.githooks/**']

community:
- changed-files:
  - any-glob-to-any-file: ['CODE_OF_CONDUCT.md', 'CONTRIBUTING.md']

license:
- changed-files:
  - any-glob-to-any-file: ['LICENSE']

readme:
- changed-files:
  - any-glob-to-any-file: ['README.md']
