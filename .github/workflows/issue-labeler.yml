name: issue-automation

on:
  issues:
    types: [opened, edited]

jobs:
  automate-issues-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Replaces the archived andymckay/labeler (node12): add "needs label" unless already labeled
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.payload.issue.labels.length > 0) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: ['needs label'],
            });
